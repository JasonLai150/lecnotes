[project]
name = "lecnotes"
version = "0.1.0"
description = "Turn a lecture deck into a workdir any coding agent can write notes from"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3",
    "pymupdf>=1.24",
]

[project.scripts]
lecnotes = "lecnotes.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lecnotes"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/superpowers/sdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Emitted by pymupdf's SWIG bindings at import. Not ours to fix; only these are silenced.
    "ignore:builtin type Swig\\w+ has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
